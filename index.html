<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Kingdom Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The pictures that stand for the digits, and the star icons. Each picture has its own outline,
       so it can be told apart without colour. Colours come from CSS variables, so the themes can change them. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="sym-heart" viewBox="0 0 100 100">
      <path style="fill: var(--sym-heart); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M50 88 C20 66 8 48 13 31 C18 14 40 11 50 28 C60 11 82 14 87 31 C92 48 80 66 50 88 Z"/>
    </symbol>
    <symbol id="sym-star" viewBox="0 0 100 100">
      <polygon style="fill: var(--sym-star); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        points="50,6 62,37 95,38 69,58 78,91 50,72 22,91 31,58 5,38 38,37"/>
    </symbol>
    <symbol id="sym-moon" viewBox="0 0 100 100">
      <path style="fill: var(--sym-moon); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M58 8 A43 43 0 1 0 93 64 A34 34 0 0 1 58 8 Z"/>
    </symbol>
    <symbol id="sym-flower" viewBox="0 0 100 100">
      <g style="fill: var(--sym-flower); stroke: var(--symbol-outline); stroke-width: 5">
        <circle cx="50" cy="25" r="17"/>
        <circle cx="74" cy="43" r="17"/>
        <circle cx="65" cy="72" r="17"/>
        <circle cx="35" cy="72" r="17"/>
        <circle cx="26" cy="43" r="17"/>
      </g>
      <circle style="fill: var(--sym-flower-centre); stroke: var(--symbol-outline); stroke-width: 5" cx="50" cy="52" r="13"/>
    </symbol>
    <symbol id="sym-raindrop" viewBox="0 0 100 100">
      <path style="fill: var(--sym-raindrop); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M50 6 C42 22 18 46 18 64 A32 32 0 0 0 82 64 C82 46 58 22 50 6 Z"/>
    </symbol>
    <symbol id="sym-crown" viewBox="0 0 100 100">
      <path style="fill: var(--sym-crown); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M10 74 L14 26 L34 50 L50 16 L66 50 L86 26 L90 74 Z M10 74 L90 74 L90 90 L10 90 Z"/>
    </symbol>
    <symbol id="sym-gem" viewBox="0 0 100 100">
      <g style="fill: var(--sym-gem); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round">
        <polygon points="28,14 72,14 94,40 50,92 6,40"/>
        <polyline style="fill: none" points="6,40 94,40"/>
        <polyline style="fill: none" points="28,14 38,40 50,92 62,40 72,14"/>
      </g>
    </symbol>
    <symbol id="sym-rainbow" viewBox="0 0 100 100">
      <g style="fill: none; stroke-linecap: butt">
        <path style="stroke: var(--symbol-outline); stroke-width: 38" d="M24 80 A26 26 0 0 1 76 80"/>
        <path style="stroke: var(--sym-heart); stroke-width: 10" d="M14 80 A36 36 0 0 1 86 80"/>
        <path style="stroke: var(--sym-star); stroke-width: 10" d="M24 80 A26 26 0 0 1 76 80"/>
        <path style="stroke: var(--sym-raindrop); stroke-width: 10" d="M34 80 A16 16 0 0 1 66 80"/>
      </g>
    </symbol>
    <symbol id="sym-unicorn" viewBox="0 0 100 100">
      <polygon style="fill: var(--sym-unicorn-horn); stroke: var(--symbol-outline); stroke-width: 4; stroke-linejoin: round"
        points="46,26 56,2 60,26"/>
      <path style="fill: var(--sym-unicorn); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M34 94 L36 62 C26 62 12 58 10 48 C8 40 16 36 24 36 L38 34 C42 26 50 22 58 22 C72 26 82 40 82 56 C82 70 78 84 76 94 Z"/>
      <path style="fill: var(--sym-unicorn-mane); stroke: var(--symbol-outline); stroke-width: 4; stroke-linejoin: round"
        d="M58 22 C76 22 92 38 90 58 C88 72 86 84 86 94 L76 94 C78 84 82 70 82 56 C82 40 72 26 58 22 Z"/>
      <circle style="fill: var(--symbol-outline)" cx="36" cy="44" r="4"/>
    </symbol>
    <symbol id="award-finished" viewBox="0 0 100 100">
      <polygon style="fill: currentColor" points="50,4 62,36 96,37 69,58 79,92 50,72 21,92 31,58 4,37 38,36"/>
      <polyline style="fill: none; stroke: var(--panel); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round"
        points="35,53 46,63 66,42"/>
    </symbol>
    <symbol id="award-careful" viewBox="0 0 100 100">
      <polygon style="fill: currentColor" points="50,4 62,36 96,37 69,58 79,92 50,72 21,92 31,58 4,37 38,36"/>
      <path style="fill: var(--panel)" d="M50 68 C38 59 33 52 35 46 C37 40 45 39 50 45 C55 39 63 40 65 46 C67 52 62 59 50 68 Z"/>
    </symbol>
    <!-- Stardust's head, shared by all her moods; each mood adds its own eyes, mouth and sparkles -->
    <symbol id="stardust-head" viewBox="0 0 240 240">
      <g style="stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round">
        <polygon style="fill: var(--sym-unicorn)" points="62,92 70,40 104,78"/>
        <polygon style="fill: var(--sym-unicorn)" points="178,92 170,40 136,78"/>
        <polygon style="fill: var(--sym-unicorn-horn)" points="106,72 120,8 134,72"/>
        <ellipse style="fill: var(--sym-unicorn)" cx="120" cy="140" rx="74" ry="66"/>
        <circle style="fill: var(--sym-unicorn-mane)" cx="74" cy="84" r="20"/>
        <circle style="fill: var(--sym-unicorn-mane)" cx="56" cy="110" r="18"/>
        <circle style="fill: var(--sym-unicorn-mane)" cx="98" cy="72" r="16"/>
        <circle style="fill: var(--sym-star)" cx="160" cy="80" r="9"/>
      </g>
      <!-- A soft muzzle without an outline, so she reads as a unicorn and not a piglet -->
      <ellipse style="fill: var(--stardust-snout)" cx="120" cy="180" rx="34" ry="20"/>
      <g style="fill: none; stroke: var(--symbol-outline); stroke-width: 3; stroke-linecap: round">
        <line x1="112" y1="56" x2="128" y2="50"/>
        <line x1="114" y1="38" x2="126" y2="33"/>
      </g>
      <g style="fill: var(--symbol-outline)">
        <circle cx="108" cy="172" r="3"/>
        <circle cx="132" cy="172" r="3"/>
      </g>
      <g style="fill: var(--sym-heart); opacity: 0.45">
        <circle cx="68" cy="150" r="11"/>
        <circle cx="172" cy="150" r="11"/>
      </g>
    </symbol>
  </svg>
  <main>
    <header>
      <div class="topbar">
        <button id="how-to-play" class="secondary" data-i18n-label="howToPlay">?</button>
        <button id="lang" class="secondary" data-i18n="otherLang">Dansk</button>
      </div>
      <h1 data-i18n="title">Rainbow Kingdom Sudoku</h1>
      <div class="stats">
        <div class="stat"><span class="label" data-i18n="level">Level</span><span id="level">1 / 20</span></div>
      </div>
    </header>

    <!-- Stardust, the young unicorn who cheers the player on; one drawing per mood -->
    <div id="mascot" data-mood="happy">
      <div class="mascot-art" aria-hidden="true">
        <svg class="mood mood-happy" viewBox="0 0 240 240">
          <g class="s-bob">
            <use href="#stardust-head"/>
            <g style="fill: var(--symbol-outline)">
              <circle cx="94" cy="128" r="11"/>
              <circle cx="146" cy="128" r="11"/>
            </g>
            <g style="fill: #ffffff">
              <circle cx="98" cy="124" r="4"/>
              <circle cx="150" cy="124" r="4"/>
            </g>
            <path style="fill: none; stroke: var(--symbol-outline); stroke-width: 4; stroke-linecap: round" d="M108 190 Q120 198 132 190"/>
          </g>
        </svg>

        <svg class="mood mood-thinking" viewBox="0 0 240 240">
          <g class="s-tilt">
            <use href="#stardust-head"/>
            <g style="fill: var(--symbol-outline)">
              <circle cx="98" cy="122" r="11"/>
              <circle cx="150" cy="122" r="11"/>
            </g>
            <g style="fill: #ffffff">
              <circle cx="103" cy="117" r="4"/>
              <circle cx="155" cy="117" r="4"/>
            </g>
            <circle style="fill: var(--symbol-outline)" cx="128" cy="192" r="5"/>
          </g>
          <g class="s-twinkle" style="fill: var(--sym-star); stroke: var(--symbol-outline); stroke-width: 3; stroke-linejoin: round">
            <polygon points="196,30 201,44 215,48 201,52 196,66 191,52 177,48 191,44"/>
            <polygon points="218,78 221,86 229,88 221,90 218,98 215,90 207,88 215,86"/>
          </g>
        </svg>

        <svg class="mood mood-celebrating" viewBox="0 0 240 240">
          <g class="s-jump">
            <use href="#stardust-head"/>
            <g style="fill: none; stroke: var(--symbol-outline); stroke-width: 5; stroke-linecap: round">
              <path d="M82 132 Q94 116 106 132"/>
              <path d="M134 132 Q146 116 158 132"/>
            </g>
            <path style="fill: var(--sym-heart); stroke: var(--symbol-outline); stroke-width: 4; stroke-linejoin: round" d="M104 186 Q120 210 136 186 Z"/>
          </g>
          <g class="s-sparkle">
            <polygon style="fill: var(--sym-star); stroke: var(--symbol-outline); stroke-width: 3" points="30,60 35,74 49,78 35,82 30,96 25,82 11,78 25,74"/>
            <polygon style="fill: var(--sym-raindrop); stroke: var(--symbol-outline); stroke-width: 3" points="210,40 214,51 225,54 214,57 210,68 206,57 195,54 206,51"/>
            <circle style="fill: var(--sym-heart)" cx="214" cy="120" r="7"/>
            <circle style="fill: var(--sym-gem)" cx="22" cy="134" r="6"/>
          </g>
        </svg>

        <svg class="mood mood-comforting" viewBox="0 0 240 240">
          <g class="s-sway">
            <use href="#stardust-head"/>
            <g style="fill: none; stroke: var(--symbol-outline); stroke-width: 5; stroke-linecap: round">
              <path d="M84 126 Q94 136 104 126"/>
              <path d="M136 126 Q146 136 156 126"/>
            </g>
            <path style="fill: none; stroke: var(--symbol-outline); stroke-width: 4; stroke-linecap: round" d="M110 192 Q120 198 130 192"/>
          </g>
          <path class="s-float" style="fill: var(--sym-heart); stroke: var(--symbol-outline); stroke-width: 3; stroke-linejoin: round"
            d="M204 74 C192 64 186 56 189 49 C192 42 200 42 204 49 C208 42 216 42 219 49 C222 56 216 64 204 74 Z"/>
        </svg>

        <svg class="mood mood-oops" viewBox="0 0 240 240">
          <g class="s-wiggle">
            <use href="#stardust-head"/>
            <g style="fill: none; stroke: var(--symbol-outline); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round">
              <polyline points="84,118 102,128 84,138"/>
              <polyline points="156,118 138,128 156,138"/>
            </g>
            <ellipse style="fill: var(--symbol-outline)" cx="120" cy="194" rx="9" ry="6"/>
          </g>
          <g class="s-puff">
            <circle style="fill: var(--sym-star)" cx="94" cy="214" r="9"/>
            <circle style="fill: var(--sym-heart)" cx="120" cy="228" r="8"/>
            <circle style="fill: var(--sym-raindrop)" cx="148" cy="214" r="9"/>
            <circle style="fill: var(--sym-moon)" cx="172" cy="230" r="7"/>
            <circle style="fill: var(--sym-gem)" cx="70" cy="230" r="7"/>
          </g>
        </svg>
      </div>
      <p id="mascot-bubble" role="status" aria-live="polite"></p>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" data-testid="board"></div>
      <p id="sweep-banner" aria-live="polite"></p>
      <div id="overlay" hidden>
        <div class="overlay-box">
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <ul id="overlay-stars"></ul>
          <button id="overlay-button"></button>
        </div>
      </div>
    </div>

    <div id="numpad" role="group" data-i18n-label="pictures"></div>
    <button id="reset" class="secondary" data-i18n="reset">Reset game</button>
  </main>

  <!-- The first lesson, shown before level 1 on a first visit and replayable from the ? button -->
  <div id="lesson" role="dialog" aria-modal="true" aria-labelledby="lesson-title" hidden>
    <div class="lesson-box">
      <button id="lesson-lang" class="secondary lesson-lang" data-i18n="otherLang">Dansk</button>
      <h2 id="lesson-title" data-i18n="lessonTitle">How to play</h2>
      <p class="lesson-hint" data-i18n="lessonHint">Each picture once in every row, column and box</p>
      <div id="lesson-board" class="board lesson-board"></div>
      <div id="lesson-pictures" class="lesson-pictures"></div>
      <div id="lesson-finished" hidden>
        <p class="lesson-cheer" data-i18n="lessonDone">Well done!</p>
        <button id="lesson-play" data-i18n="lessonPlay">Let's play!</button>
      </div>
      <button id="lesson-skip" class="secondary" data-i18n="lessonSkip">Skip</button>
    </div>
  </div>
  <script src="storage.js"></script>
  <script src="dom.js"></script>
  <script src="i18n.js"></script>
  <script src="sudoku.js"></script>
  <script src="symbols.js"></script>
  <script src="cells.js"></script>
  <script src="mascot.js"></script>
  <script src="lesson.js"></script>
  <script src="game.js"></script>
</body>
</html>
